name: Photograph intake

# A batch lands as uploads/pending/<batch>.json (written by the upload page).
# This fetches each photograph out of Blob, shrinks it into the site's image
# folder, geocodes the place once, and appends the entries to
# build/uploads.json. Pages rebuilds on the resulting commit.

on:
  push:
    paths:
      - 'uploads/pending/*.json'    # a new batch from the upload page
      - 'build/uploads.json'        # a caption edited, or a photograph removed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet pillow

      - name: Process pending batches
        run: python3 build/intake.py

      # Two people acting within the same minute — or one person deleting two
      # photographs in a row — used to lose the second change: the push was
      # rejected because the remote had moved, and the run simply failed. The
      # work is derived entirely from build/uploads.json and the pending
      # batches, so the honest recovery is to start again from wherever the
      # remote now is and redo it.
      - name: Commit, and start again if the remote moved
        run: |
          git config user.name  "photograph intake"
          git config user.email "intake@users.noreply.github.com"
          for try in 1 2 3 4 5; do
            if [ -z "$(git status --porcelain)" ]; then
              echo "Nothing to commit — someone else got there first."
              exit 0
            fi
            git add -A
            git commit -m "Intake: photographs added to the gallery and map"
            if git push; then
              exit 0
            fi
            echo "The remote moved while we worked; redoing it from there (try $try)."
            sleep $((try * 5))
            git fetch origin main
            git reset --hard origin/main
            python3 build/intake.py
          done
          echo "Gave up after five tries. Nothing is lost: the batch is still in"
          echo "uploads/pending/ and this can be run again from the Actions tab."
          exit 1
